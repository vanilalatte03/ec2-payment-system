name: ec2-payment-cd

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source revision
        id: source
        run: |
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::780183300892:role/ec2-payment-github-actions-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push deployment image
        env:
          # GitHub Variables
          # ECR_REPOSITORY: ECR 저장소 이름
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.source.outputs.sha }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            --push \
            .

      - name: Decide next deployment color
        env:
          # GitHub Variables
          # AWS_REGION: 배포 대상 리전
          # ALB_LISTENER_ARN: ALB에서 blue/green 전환할 리스너 ARN
          # BLUE_TARGET_GROUP_ARN: blue(8081) 타겟 그룹 ARN
          # GREEN_TARGET_GROUP_ARN: green(8082) 타겟 그룹 ARN
          AWS_REGION: ${{ vars.AWS_REGION }}
          ALB_LISTENER_ARN: ${{ vars.ALB_LISTENER_ARN }}
          BLUE_TARGET_GROUP_ARN: ${{ vars.BLUE_TARGET_GROUP_ARN }}
          GREEN_TARGET_GROUP_ARN: ${{ vars.GREEN_TARGET_GROUP_ARN }}
        id: color
        run: |
          current_tg_arn=$(aws elbv2 describe-listeners \
            --listener-arns "$ALB_LISTENER_ARN" \
            --query 'Listeners[0].DefaultActions[0].TargetGroupArn' \
            --output text)

          if [ "$current_tg_arn" = "$BLUE_TARGET_GROUP_ARN" ]; then
            echo "current_color=blue" >> "$GITHUB_OUTPUT"
            echo "next_color=green" >> "$GITHUB_OUTPUT"
            echo "next_port=8082" >> "$GITHUB_OUTPUT"
            echo "next_tg_arn=$GREEN_TARGET_GROUP_ARN" >> "$GITHUB_OUTPUT"
            echo "current_tg_arn=$BLUE_TARGET_GROUP_ARN" >> "$GITHUB_OUTPUT"
          else
            echo "current_color=green" >> "$GITHUB_OUTPUT"
            echo "next_color=blue" >> "$GITHUB_OUTPUT"
            echo "next_port=8081" >> "$GITHUB_OUTPUT"
            echo "next_tg_arn=$BLUE_TARGET_GROUP_ARN" >> "$GITHUB_OUTPUT"
            echo "current_tg_arn=$GREEN_TARGET_GROUP_ARN" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy inactive color on EC2
        id: deploy
        env:
          # GitHub Variables
          # AWS_REGION: 배포 대상 리전
          # ECR_REPOSITORY: ECR 저장소 이름
          # EC2_INSTANCE_ID: 배포 대상 EC2 인스턴스 ID
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.source.outputs.sha }}
          NEXT_COLOR: ${{ steps.color.outputs.next_color }}
          NEXT_PORT: ${{ steps.color.outputs.next_port }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          compose_base64=$(base64 -w 0 docker-compose.yml)

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${NEXT_COLOR} ${IMAGE_TAG}" \
            --parameters commands="[
              \"set -e\",
              \"sudo mkdir -p /opt/ec2-payment/env\",
              \"printf '%s' '${compose_base64}' | base64 -d | sudo tee /opt/ec2-payment/docker-compose.yml > /dev/null\",
              \"cd /opt/ec2-payment\",
              \"aws ecr get-login-password --region ${AWS_REGION} | sudo docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
              \"sudo env APP_IMAGE=${image_uri} docker compose --env-file env/.env pull app-${NEXT_COLOR}\",
              \"sudo env APP_IMAGE=${image_uri} docker compose --env-file env/.env up -d --force-recreate app-${NEXT_COLOR}\",
              \"for i in \$(seq 1 24); do code=\\\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:${NEXT_PORT}/ || true); if [ \\\"\\\$code\\\" = \\\"200\\\" ] || [ \\\"\\\$code\\\" = \\\"301\\\" ] || [ \\\"\\\$code\\\" = \\\"302\\\" ] || [ \\\"\\\$code\\\" = \\\"401\\\" ] || [ \\\"\\\$code\\\" = \\\"403\\\" ] || [ \\\"\\\$code\\\" = \\\"404\\\" ]; then exit 0; fi; sleep 5; done; exit 1\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for remote deployment command
        env:
          # GitHub Variables
          # EC2_INSTANCE_ID: SSM 명령 결과를 조회할 EC2 인스턴스 ID
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          for _ in $(seq 1 60); do
            set +e
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/tmp/ssm-invocation-error)
            status_exit_code=$?
            set -e

            if [ "$status_exit_code" -ne 0 ]; then
              cat /tmp/ssm-invocation-error
              sleep 5
              continue
            fi

            if [ "$status" = "Success" ]; then
              exit 0
            fi

            if [ "$status" = "Failed" ] || [ "$status" = "Cancelled" ] || [ "$status" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "EC2 deployment command timed out"
          exit 1

      - name: Wait for target group health
        env:
          # GitHub Variables
          # NEXT_TG_ARN은 직전 step에서 계산된 현재 배포 대상 그룹 ARN
          NEXT_TG_ARN: ${{ steps.color.outputs.next_tg_arn }}
        run: |
          for _ in $(seq 1 36); do
            healthy_count=$(aws elbv2 describe-target-health \
              --target-group-arn "$NEXT_TG_ARN" \
              --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" \
              --output text)

            if [ "$healthy_count" != "0" ]; then
              exit 0
            fi

            sleep 5
          done

          echo "Target group did not become healthy in time"
          exit 1

      - name: Switch ALB listener to new target group
        env:
          # GitHub Variables
          # ALB_LISTENER_ARN: 실제 서비스 트래픽이 걸린 ALB 리스너 ARN
          NEXT_TG_ARN: ${{ steps.color.outputs.next_tg_arn }}
          ALB_LISTENER_ARN: ${{ vars.ALB_LISTENER_ARN }}
        run: |
          aws elbv2 modify-listener \
            --listener-arn "$ALB_LISTENER_ARN" \
            --default-actions Type=forward,TargetGroupArn="$NEXT_TG_ARN"

      - name: Stop previous color after cutover
        env:
          # GitHub Variables
          # EC2_INSTANCE_ID: 이전 색 컨테이너를 중지할 EC2 인스턴스 ID
          CURRENT_COLOR: ${{ steps.color.outputs.current_color }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Stop ${CURRENT_COLOR} after cutover" \
            --parameters commands="[
              \"set -e\",
              \"cd /opt/ec2-payment\",
              \"sudo docker compose --env-file env/.env stop app-${CURRENT_COLOR}\"
            ]" \
            --query 'Command.CommandId' \
            --output text
